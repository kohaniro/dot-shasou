<meta name="claude:viewport-fit-sides" content="cover">
<title>ドット車窓</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one-screen stage. The canvas sits centered at a whole-pixel scale; a slim console below it, lettered like a door-top LED display. */
:root{
  --bg:#12151a;
  --panel:#1b2027;
  --line:#313a46;
  --fg:#d9dee4;
  --muted:#8792a0;
  --amber:#f2b84b;
  --font-ui:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box;
  background:var(--bg);color:var(--fg);
  font-family:var(--font-ui);font-size:15px;line-height:1.4;
  display:flex;flex-direction:column;gap:10px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.top h1{margin:0;font-size:18px;font-weight:400;letter-spacing:.12em}
.led{color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.led .sep{color:var(--muted);margin-inline:.5em}
.led .next{color:var(--muted)}
#stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#stage:fullscreen{background:#000}
#view{display:block;image-rendering:crisp-edges;image-rendering:pixelated;background:#000;max-width:100%}
.console{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  background:var(--panel);border:1px solid var(--line);padding:8px 10px;
}
.console button{
  font:inherit;color:var(--fg);background:transparent;
  border:1px solid var(--line);padding:5px 12px;cursor:pointer;
}
.console button:hover{border-color:var(--muted)}
.console button[aria-pressed="true"]{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.console button:focus-visible,.console input:focus-visible,.console select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.vol{display:flex;align-items:center;gap:8px;color:var(--muted)}
.vol input{width:110px;max-width:40vw;accent-color:var(--amber)}
.vol select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:4px 6px}
.spacer{flex:1}
@media (max-width:480px){.spacer{display:none}}
/* デバッグ用の行（「デバッグ」ボタンか URL の ?debug で debug.js が hidden を外す） */
.console[hidden]{display:none}
.debug{font-size:13px;color:var(--muted);padding-block:6px;flex-direction:column;align-items:stretch;gap:6px}
.debug button{padding:3px 12px}
.dbg-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.dbg-cap{min-width:2.5em}
#dbg-rate button,#dbg-tod button,#dbg-wx button{min-width:3.4em}
.dbg-info{font-variant-numeric:tabular-nums;min-height:2.8em}
</style>

<div class="top">
  <h1>ドット車窓</h1>
  <div class="led" aria-live="off"><span id="line-label">路線 ----</span><span class="sep">/</span><span id="speed-label">-- km/h</span><span class="sep">/</span><span id="next-label" class="next"></span></div>
</div>

<div id="stage"><canvas id="view" width="640" height="260" aria-label="電車の車内から向かいの窓越しに流れる街の景色"></canvas></div>

<div class="console">
  <button id="btn-sound" type="button" aria-pressed="false">音を出す</button>
  <label class="vol" for="vol">音量 <input id="vol" type="range" min="0" max="100" value="60"></label>
  <button id="btn-pause" type="button" aria-pressed="false">一時停止</button>
  <label class="vol" for="style">絵柄 <select id="style"><option value="real">写実</option><option value="soft">淡彩</option><option value="game">ゲーム風 16色</option><option value="mono">モノクロ 4色</option></select></label>
  <label class="vol" for="pass">乗客 <select id="pass"><option value="on">あり</option><option value="sil">シルエット</option><option value="off">なし</option></select></label>
  <span class="spacer"></span>
  <button id="btn-debug" type="button" aria-pressed="false" aria-controls="debug">デバッグ</button>
  <button id="btn-line" type="button">別の路線へ</button>
  <button id="btn-full" type="button">全画面</button>
</div>

<div class="console debug" id="debug" hidden>
  <div class="dbg-row" id="dbg-rate" role="group" aria-label="再生速度">
    <span class="dbg-cap">速度</span>
    <button type="button" data-rate="0" aria-pressed="false">停止</button>
    <button type="button" data-rate="1" aria-pressed="true">×1</button>
    <button type="button" data-rate="2" aria-pressed="false">×2</button>
    <button type="button" data-rate="4" aria-pressed="false">×4</button>
    <button type="button" data-rate="8" aria-pressed="false">×8</button>
    <button type="button" data-rate="16" aria-pressed="false">×16</button>
  </div>
  <div class="dbg-row" id="dbg-jump" role="group" aria-label="移動">
    <span class="dbg-cap">移動</span>
    <button id="dbg-biome" type="button">次のバイオームへ</button>
    <button id="dbg-station" type="button">次の駅の手前へ</button>
    <button id="dbg-tunnel" type="button">次のトンネルへ</button>
    <button id="dbg-bridge" type="button">次の橋へ</button>
    <button id="dbg-elev" type="button">次の高架へ</button>
    <button id="dbg-xing" type="button">次の踏切へ</button>
    <button id="dbg-wall" type="button">次の至近の建物へ</button>
    <button id="dbg-train" type="button">次の対向列車へ</button>
    <button id="dbg-dusk" type="button">次の夕方へ</button>
    <button id="dbg-dawn" type="button">次の朝へ</button>
    <button id="dbg-wxnext" type="button">次の天気の変わり目へ</button>
  </div>
  <div class="dbg-row" id="dbg-tod" role="group" aria-label="時間帯の固定">
    <span class="dbg-cap">時間帯</span>
    <button type="button" data-tod="auto" aria-pressed="true">自動</button>
    <button type="button" data-tod="dawn" aria-pressed="false">朝</button>
    <button type="button" data-tod="noon" aria-pressed="false">昼</button>
    <button type="button" data-tod="dusk" aria-pressed="false">夕</button>
    <button type="button" data-tod="night" aria-pressed="false">夜</button>
  </div>
  <div class="dbg-row" id="dbg-wx" role="group" aria-label="天気の固定">
    <span class="dbg-cap">天気</span>
    <button type="button" data-wx="auto" aria-pressed="true">自動</button>
    <button type="button" data-wx="clear" aria-pressed="false">晴</button>
    <button type="button" data-wx="cloud" aria-pressed="false">曇</button>
    <button type="button" data-wx="rain" aria-pressed="false">雨</button>
    <button type="button" data-wx="snow" aria-pressed="false">雪</button>
  </div>
  <output id="dbg-info" class="dbg-info"></output>
</div>

<script type="module" src="src/main.js"></script>
