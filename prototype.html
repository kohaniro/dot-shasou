<meta name="claude:viewport-fit-sides" content="cover">
<title>ドット車窓</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one-screen stage. The canvas sits centered at a whole-pixel scale; a slim console below it, lettered like a door-top LED display. */
:root{
  --bg:#12151a;
  --panel:#1b2027;
  --line:#313a46;
  --fg:#d9dee4;
  --muted:#8792a0;
  --amber:#f2b84b;
  --font-ui:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box;
  background:var(--bg);color:var(--fg);
  font-family:var(--font-ui);font-size:15px;line-height:1.4;
  display:flex;flex-direction:column;gap:10px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.top h1{margin:0;font-size:18px;font-weight:400;letter-spacing:.12em}
.led{color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.led .sep{color:var(--muted);margin-inline:.5em}
#stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#stage:fullscreen{background:#000}
#view{display:block;image-rendering:crisp-edges;image-rendering:pixelated;background:#000;max-width:100%}
.console{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  background:var(--panel);border:1px solid var(--line);padding:8px 10px;
}
.console button{
  font:inherit;color:var(--fg);background:transparent;
  border:1px solid var(--line);padding:5px 12px;cursor:pointer;
}
.console button:hover{border-color:var(--muted)}
.console button[aria-pressed="true"]{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.console button:focus-visible,.console input:focus-visible,.console select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.vol{display:flex;align-items:center;gap:8px;color:var(--muted)}
.vol input{width:110px;max-width:40vw;accent-color:var(--amber)}
.vol select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:4px 6px}
.spacer{flex:1}
@media (max-width:480px){.spacer{display:none}}
</style>

<div class="top">
  <h1>ドット車窓</h1>
  <div class="led" aria-live="off"><span id="line-label">路線 ----</span><span class="sep">/</span><span id="speed-label">-- km/h</span></div>
</div>

<div id="stage"><canvas id="view" width="640" height="260" aria-label="電車の車内から向かいの窓越しに流れる街の景色"></canvas></div>

<div class="console">
  <button id="btn-sound" type="button" aria-pressed="false">音を出す</button>
  <label class="vol" for="vol">音量 <input id="vol" type="range" min="0" max="100" value="60"></label>
  <button id="btn-pause" type="button" aria-pressed="false">一時停止</button>
  <label class="vol" for="style">絵柄 <select id="style"><option value="real">写実</option><option value="soft">淡彩</option><option value="game">ゲーム風 16色</option><option value="mono">モノクロ 4色</option></select></label>
  <button id="btn-pass" type="button" aria-pressed="true">乗客あり</button>
  <span class="spacer"></span>
  <button id="btn-line" type="button">別の路線へ</button>
  <button id="btn-full" type="button">全画面</button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('view');
const cx = cv.getContext('2d');

/* ---------- 解像度: 寸法はすべて基準ドット(横320)で書き、u() で K 倍する ---------- */
let K = 1, W = 320, SY = 26, SH = 80, VY = 20, VH = 130, SUB = 2;
const u = n => Math.round(n * K);

/* ---------- random / colour helpers ---------- */
function hash32(a, b, c) {
  let h = 2166136261 ^ a;
  h = Math.imul(h ^ b, 16777619);
  h = Math.imul(h ^ (c | 0), 16777619);
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995);
  return (h ^ (h >>> 15)) >>> 0;
}
function rng(s) {
  s = s >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = rgb(a), B = rgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const shade = (c, t) => mix(c, '#1b2230', t);
const tint = (c, t) => mix(c, '#ffffff', t);

/* ---------- 絵柄（スタイル）: 描画時に色を差し替える ---------- */
const lum = c => { const [r, g, b] = rgb(c); return 0.299 * r + 0.587 * g + 0.114 * b; };
const S16 = ['#1a1c2c', '#5d275d', '#b13e53', '#ef7d57', '#ffcd75', '#a7f070', '#38b764', '#257179', '#29366f', '#3b5dc9', '#41a6f6', '#73eff7', '#f4f4f4', '#94b0c2', '#566c86', '#333c57'];
const S16rgb = S16.map(rgb);
function nearest16(c) { const [r, g, b] = rgb(c); let bi = 0, bd = 1e9; S16rgb.forEach((p, i) => { const d = (p[0] - r) ** 2 + (p[1] - g) ** 2 + (p[2] - b) ** 2; if (d < bd) { bd = d; bi = i; } }); return S16[bi]; }
const MONO = ['#1f2b24', '#4a6650', '#8fae7c', '#d9e6b9'];
function mono(c) { const l = lum(c); return MONO[l < 72 ? 0 : l < 128 ? 1 : l < 188 ? 2 : 3]; }
function soft(c) { const l = Math.round(lum(c)).toString(16).padStart(2, '0'); return mix(mix(c, '#' + l + l + l, 0.3), '#fff6ea', 0.2); }
const STYLES = {
  real: { pal: null, outline: false, glass: true },
  game: { pal: nearest16, outline: true, glass: false },
  mono: { pal: mono, outline: true, glass: false },
  soft: { pal: soft, outline: false, glass: true }
};
let STYLE = STYLES.real;
const palCache = new Map(), INK = '#1a1c2c';
function P(c) { if (!STYLE.pal) return c; let v = palCache.get(c); if (v === undefined) { v = STYLE.pal(c); palCache.set(c, v); } return v; }
function R(g, x, y, w, h, c) { if (w <= 0 || h <= 0) return; g.fillStyle = P(c); g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function ink(g, x, top, w, h) { if (!STYLE.outline) return; R(g, x, top, 1, h, INK); R(g, x + w - 1, top, 1, h, INK); R(g, x, top, w, 1, INK); }
/* 窓: 細かい解像度では上辺の影と中桟を足す */
function win(g, x, y, w, h, c) {
  R(g, x, y, w, h, c);
  if (K > 1 && w >= 4 && h >= 3) { R(g, x, y, w, 1, shade(c, 0.25)); if (w >= 6) R(g, x + (w >> 1), y, 1, h, tint(c, 0.3)); }
}

/* ---------- world parameters ---------- */
let seed = 1;
function vnoise(x, salt) {
  const i = Math.floor(x), f = x - i;
  const a = hash32(seed, salt, i) / 4294967296, b = hash32(seed, salt, i + 1) / 4294967296;
  return a + (b - a) * f * f * (3 - 2 * f);
}
/* 都市度 0..1: 高いほど高層・高密度。距離に沿ってゆっくり変化する */
function density(d) {
  let n = 0.7 * vnoise(d / 7000, 11) + 0.3 * vnoise(d / 1900, 12);
  n = Math.min(1, Math.max(0, (n - 0.5) * 1.8 + 0.5));
  const k = Math.min(1, Math.max(0, (d - 2500) / 6000));
  return 0.82 + (n - 0.82) * k * k * (3 - 2 * k); // 出発直後は都心から
}

const HAZE = '#c5d9e6';
const BODY = ['#cfcabd', '#b9b3a6', '#d8d2c2', '#a89f93', '#c2b8a3', '#9b8f86', '#e2dfd6', '#b0a7a0', '#8f8a8a', '#c9bfb0', '#a3877a', '#7d6f6a'];
const BODY_LIGHT = ['#e2dfd6', '#d8d2c2', '#cfcabd', '#d9cdbd', '#c9d0d0', '#e6dccb'];
const GLASS = [['#5d7f99', '#86aac2', '#42607a'], ['#5f8f8a', '#8ab8b0', '#416b68'], ['#6a7f95', '#9bb3c8', '#4a5b70'], ['#4f6f8f', '#7d9fc0', '#38516c']];
const SIGN = ['#d85a4a', '#3f7fb5', '#e9c046', '#4f9a6a', '#e8e4d8', '#7a5fa8', '#e58a3c', '#2f8f9a'];
const AWN = ['#b5483c', '#3f6f8f', '#4f8a5a', '#d6a13a', '#e8e4d8'];
const HOUSE_WALL = ['#e6e0d2', '#d6cfc0', '#c9c4bc', '#b8a58f', '#ded6c4', '#a9a39b', '#cdbfa8'];
const ROOF = ['#4a5560', '#5b4d47', '#3f4a5a', '#7a4f3f', '#56605a', '#6b6f73'];
const WIN_D = '#3d4f63', WIN_M = '#5b7389', WIN_L = '#8fb1c9';
const GREENS = ['#4f7a45', '#5f8c4f', '#3f6a3d'];

/* ---------- chunked parallax layers ---------- */
function Layer(id, factor, cw0, draw) { this.id = id; this.f = factor; this.cw0 = cw0; this.cw = cw0; this.draw = draw; this.cache = new Map(); }
Layer.prototype.chunk = function (i) {
  let c = this.cache.get(i);
  if (!c) {
    c = document.createElement('canvas'); c.width = this.cw; c.height = SH;
    this.draw(c.getContext('2d'), i, rng(hash32(seed, this.id, i)), this);
    this.cache.set(i, c);
    if (this.cache.size > 8) for (const k of this.cache.keys()) if (Math.abs(k - i) > 3) this.cache.delete(k);
  }
  return c;
};
Layer.prototype.render = function (g, off, oy) {
  const wx = Math.floor(off);
  const i0 = Math.floor(wx / this.cw), i1 = Math.floor((wx + W - 1) / this.cw);
  for (let i = i0; i <= i1; i++) g.drawImage(this.chunk(i), i * this.cw - wx, oy);
};
const dens = (L, i, x) => density((i * L.cw + x) / (L.f * K));

/* ---------- sky ---------- */
const sky = document.createElement('canvas');
function buildSky() {
  const g = sky.getContext('2d');
  const bands = ['#4f93cf', '#62a3d8', '#7bb4e0', '#98c6e8', '#b7d8ef', '#d3e8f4'];
  const bh = u(9);
  bands.forEach((c, k) => R(g, 0, k * bh, W, bh, c));
  for (let k = 1; k < bands.length; k++) {           // 境目を市松ディザでなじませる
    g.fillStyle = P(bands[k]);
    for (let x = 0; x < W; x += 2) { g.fillRect(x, k * bh - 1, 1, 1); g.fillRect(x + 1, k * bh - 2, 1, 1); }
    if (K > 1) for (let x = 0; x < W; x += 4) g.fillRect(x + 1, k * bh - 4, 1, 1);
    g.fillStyle = P(bands[k - 1]);
    for (let x = 0; x < W; x += 4) g.fillRect(x + 2, k * bh, 1, 1);
  }
  R(g, 0, bands.length * bh, W, SH + 2 - bands.length * bh, '#d3e8f4');
}

function ell(g, ex, ey, rx, ry, c) {
  for (let dy = -ry; dy <= ry; dy++) {
    const half = Math.round(rx * Math.sqrt(1 - (dy * dy) / (ry * ry + 0.5)));
    R(g, ex - half, ey + dy, half * 2, 1, c);
  }
}
function drawClouds(g, i, r, L) {
  const n = ri(r, 1, 3);
  for (let k = 0; k < n; k++) {
    const x0 = ri(r, u(30), L.cw - u(40)), y0 = ri(r, u(9), u(34)), parts = [];
    for (let p = ri(r, 3, 5); p > 0; p--) parts.push([x0 + ri(r, -u(15), u(15)), y0 + ri(r, -u(2), u(2)), ri(r, u(6), u(13)), ri(r, u(2), u(4))]);
    parts.forEach(p => ell(g, p[0], p[1] + 1, p[2], p[3], '#d2e0ec'));
    parts.forEach(p => ell(g, p[0], p[1], p[2], p[3], '#f4f8fb'));
  }
}

/* ---------- far skyline ---------- */
function drawFar(g, i, r, L) {
  const cw = L.cw, base = u(52);
  const c1 = mix('#6f8aa8', HAZE, 0.5), c2 = mix('#7f93a8', HAZE, 0.42), c3 = mix('#566f8c', HAZE, 0.45), cw1 = mix('#4a6585', HAZE, 0.5);
  R(g, 0, base, cw, SH - base, mix('#8fa3b3', HAZE, 0.35));
  let x = 0;
  while (x < cw) {
    const d = dens(L, i, x);
    if (r() < 0.25 - 0.2 * d) { x += ri(r, u(2), u(8)); continue; }
    const w = Math.min(ri(r, u(5), u(14)), cw - x);
    let h = Math.round(K * (2 + d * d * 26) * (0.4 + r() * 0.9));
    if (d > 0.7 && r() < 0.14) h += ri(r, u(8), u(16));
    const c = r() < 0.5 ? c1 : c2;
    R(g, x, base - h, w, h, c); R(g, x + w - 1, base - h, 1, h, c3);
    if (h > u(10) && w > 4 && r() < 0.55) for (let y = base - h + u(2); y < base - 1; y += u(3)) R(g, x + 1, y, w - 3, 1, cw1);
    if (h > u(20) && r() < 0.3) { const ah = ri(r, u(3), u(6)); R(g, x + (w >> 1), base - h - ah, 1, ah, c3); }
    x += w + (r() < 0.4 ? 1 : 0);
  }
}

/* ---------- mid-distance buildings ---------- */
function drawMid(g, i, r, L) {
  const cw = L.cw, base = u(59);
  R(g, 0, base, cw, SH - base, mix('#8a938f', HAZE, 0.35));
  for (let k = 0; k < 40 * K; k++) { // 低い屋根の連なり
    const c = mix(pick(r, ROOF.concat(HOUSE_WALL)), HAZE, 0.5);
    R(g, ri(r, 0, cw - u(8)), base + ri(r, 0, u(7)), ri(r, u(4), u(9)), ri(r, 1, u(2)), c);
  }
  const wd = mix(WIN_D, HAZE, 0.42);
  const st = u(3), pw = st - Math.max(1, Math.round(K)), ph = Math.max(1, Math.round(K * 1.2));
  let x = 0;
  while (x < cw) {
    const d = dens(L, i, x);
    if (r() < 0.2 - 0.15 * d) { x += ri(r, u(3), u(10)); continue; }
    const w = Math.min(ri(r, u(9), u(24)), cw - x);
    const h = Math.round(K * (5 + d * 42) * (0.5 + r() * 0.8));
    const c = mix(pick(r, BODY), HAZE, 0.48), top = base - h, m = u(2);
    R(g, x, top, w, h, c); R(g, x, top, 1, h, tint(c, 0.25)); R(g, x, top, w, 1, tint(c, 0.25));
    R(g, x + w - m, top, m, h, shade(c, 0.16));
    if (w > u(5)) {
      if (r() < 0.5) { for (let y = top + u(2); y + ph < base - 1; y += st) for (let xx = x + m; xx + pw <= x + w - m - 1; xx += st) R(g, xx, y, pw, ph, wd); }
      else {
        const bs = u(4), bh2 = u(2);
        for (let y = top + u(2); y + bh2 < base - 1; y += bs) {
          R(g, x + m, y, w - 2 * m - 1, bh2, wd);
          if (K > 1) for (let xx = x + m + bs; xx < x + w - m - 1; xx += bs) R(g, xx, y, 1, bh2, c);
        }
      }
    }
    if (h > u(12) && r() < 0.5) R(g, x + ri(r, 1, Math.max(1, w - u(6))), top - u(2), ri(r, u(3), u(5)), u(2), shade(c, 0.12));
    if (h > u(18) && r() < 0.25) { const ah = ri(r, u(4), u(7)); R(g, x + ri(r, 2, Math.max(2, w - 3)), top - ah, 1, ah, shade(c, 0.3)); }
    x += w + (r() < 0.4 ? ri(r, 1, u(2)) : 0);
  }
}

/* ---------- near buildings ---------- */
function tank(g, px, top) {
  const tw = u(4), th = u(3), leg = u(2);
  R(g, px, top - leg - th, tw, th, '#bcc7cc'); R(g, px, top - leg - th, tw, 1, '#dfe6e9');
  if (K > 1) R(g, px, top - leg - (th >> 1), tw, 1, '#9aa6ab');
  R(g, px, top - leg, 1, leg, '#6c7275'); R(g, px + tw - 1, top - leg, 1, leg, '#6c7275');
}
function roofStuff(g, r, x, top, w, c) {
  if (w < u(10)) return;
  const t = r();
  if (K > 1 && r() < 0.5) { // 屋上の手すり
    const ry = top - u(1.5);
    R(g, x + 1, ry, w - 2, 1, '#7b8184');
    for (let xx = x + 1; xx < x + w - 1; xx += u(3)) R(g, xx, ry, 1, top - ry, '#7b8184');
  }
  if (t < 0.35) {
    const pw = ri(r, u(4), Math.max(u(4), (w / 3) | 0)), ph = ri(r, u(3), u(5)), px = x + ri(r, 1, Math.max(1, w - pw - 2));
    R(g, px, top - ph, pw, ph, shade(c, 0.14)); R(g, px, top - ph, pw, 1, tint(c, 0.2));
    if (K > 1) { R(g, px + pw - 1, top - ph, 1, ph, shade(c, 0.3)); R(g, px + 2, top - ph + 2, u(1.5), ph - 2, shade(c, 0.4)); }
  } else if (t < 0.55) {
    tank(g, x + ri(r, u(2), Math.max(u(2), w - u(7))), top);
  } else if (t < 0.72) {
    const bw = Math.min(w - 4, ri(r, u(9), u(16))), bh = u(7), leg = u(2), bx = x + ri(r, 1, Math.max(1, w - bw - 2)), sc = pick(r, SIGN), lh = Math.max(1, u(0.6));
    R(g, bx + 1, top - leg, 1, leg, '#5d6266'); R(g, bx + bw - 2, top - leg, 1, leg, '#5d6266');
    R(g, bx, top - leg - bh, bw, bh, sc);
    R(g, bx + u(2), top - leg - bh + u(2), bw - u(5), lh, tint(sc, 0.75));
    R(g, bx + u(2), top - leg - bh + u(4), (bw / 2) | 0, lh, tint(sc, 0.75));
    if (K > 1) { R(g, bx, top - leg - 1, bw, 1, shade(sc, 0.3)); R(g, bx + bw - 1, top - leg - bh, 1, bh, shade(sc, 0.3)); }
  }
  if (r() < 0.3) { const ah = ri(r, u(4), u(8)); R(g, x + ri(r, 2, w - 3), top - ah, 1, ah, '#565b5e'); }
}
function bOffice(g, r, x, b, w, h) {
  const c = pick(r, BODY), hi = tint(c, 0.25), sh = shade(c, 0.28), top = b - h, m = u(2);
  R(g, x, top, w, h, c); R(g, x, top, 1, h, hi); R(g, x + w - m, top, m, h, sh); R(g, x, top, w, 1, hi);
  const fh = u(r() < 0.5 ? 5 : 6), wh = fh - u(3), pw = ri(r, u(3), u(6)), gf = u(6), xe = x + w - m - 1;
  for (let y = top + u(3); y + wh < b - gf; y += fh) {
    R(g, x + m, y, xe - x - m, wh, WIN_D);
    for (let xx = x + m; xx < xe; xx += pw + 1) {
      const cwid = Math.min(pw, xe - xx), t = r();
      if (t < 0.25) R(g, xx, y, cwid, wh, t < 0.12 ? WIN_M : WIN_L);
      else if (K > 1 && t < 0.4) R(g, xx, y, cwid, Math.max(1, wh >> 1), '#c9c5b6'); // 半分下りたブラインド
      if (xx + pw < xe) R(g, xx + pw, y, 1, wh, c);
    }
    if (K > 1) R(g, x + m, y + wh, xe - x - m, 1, hi);
  }
  R(g, x + 1, b - u(5), w - m - 1, u(5), shade(c, 0.5));
  if (r() < 0.6) R(g, x + 1, b - u(5) - u(1), w - m - 1, u(1), pick(r, AWN));
  win(g, x + u(3), b - u(4), Math.min(w - u(6), ri(r, u(3), u(7))), u(4), WIN_L);
  ink(g, x, top, w, h);
  roofStuff(g, r, x, top, w, c);
}
function bGlass(g, r, x, b, w, h) {
  const s = pick(r, GLASS), top = b - h, a = top + ((h * 0.3) | 0), z = top + ((h * 0.68) | 0), side = u(3), mx = u(4), my = u(5);

    const r = rng(hash32(seed, 77, salt)); passengers = [];
    for (let k = 0; k < 7; k++) {
      if (r() > 0.6) continue;
      const q = r();
      passengers.push({
        cx: Math.round(46 + (k + 0.5) * 228 / 7), skin: pick(r, SKIN), hair: pick(r, HAIR), hs: ri(r, 0, 3), cap: pick(r, TOPS),
        top: pick(r, TOPS), bottom: pick(r, BOTTOMS), pose: q < 0.4 ? 'phone' : q < 0.6 ? 'sleep' : q < 0.75 ? 'book' : 'idle',
        phase: r() * 20, h: ri(r, 0, 3), lean: r() < 0.5 ? -1 : 1, look: ri(r, -1, 1), mask: r() < 0.2, collar: r() < 0.4, bag: r() < 0.5, book: pick(r, BOOKS)
      });
    }
    if (passengers.length >= 3) break;
  }
}
function drawPerson(g, p, t) {
  const cx = p.cx, T = p.top, Ts = shade(T, 0.22), Th = tint(T, 0.2), B = p.bottom, sk = p.skin, sks = shade(sk, 0.2), hair = p.hair, tt = t + p.phase;
  const base = 85 + p.h, sy = base + 14;
  let hx = cx, hy = base, eyes = true, ey = base + 7;
  if (p.pose === 'sleep') { hy += 3 + (Math.sin(tt * 0.8) > 0.5 ? 1 : 0); hx += p.lean; eyes = false; }      // こっくり
  else if (p.pose === 'phone' || p.pose === 'book') { hy += 1; ey = hy + 8; }                                 // うつむき
  // 脚（ひざから先は画面の下へ）
  R(g, cx - 11, 133, 9, 9, B); R(g, cx + 3, 133, 9, 9, B); R(g, cx - 11, 133, 9, 1, tint(B, 0.15)); R(g, cx + 3, 133, 9, 1, tint(B, 0.15));
  R(g, cx - 10, 142, 7, 8, shade(B, 0.18)); R(g, cx + 4, 142, 7, 8, shade(B, 0.18));
  // 胴と上腕
  R(g, cx - 10, sy + 1, 21, 134 - sy, T); R(g, cx - 8, sy, 17, 1, T); R(g, cx + 8, sy + 2, 3, 132 - sy, Ts);
  R(g, cx - 13, sy + 2, 3, 19, Ts); R(g, cx + 11, sy + 2, 3, 19, Ts); R(g, cx - 12, sy + 1, 2, 1, Ts); R(g, cx + 11, sy + 1, 2, 1, Ts);
  R(g, cx - 2, base + 12, 5, 3, sks);
  if (p.collar) { R(g, cx - 4, sy, 3, 2, Th); R(g, cx + 2, sy, 3, 2, Th); }
  // しぐさ
  if (p.pose === 'phone') {
    R(g, cx - 13, 119, 11, 4, Ts); R(g, cx + 3, 119, 11, 4, Ts);
    R(g, cx - 2, 112, 5, 8, '#2a2d33'); R(g, cx - 2, 112, 5, 1, '#4a4f58');
    R(g, cx - 4, 116, 3, 4, sk); R(g, cx + 2, 116, 3, 4, sk);
    R(g, cx + 1, 115 + (Math.floor(tt * 2.5) % 3 === 0 ? 1 : 0), 1, 1, sk);   // 親指
  } else if (p.pose === 'book') {
    R(g, cx - 13, 121, 11, 4, Ts); R(g, cx + 3, 121, 11, 4, Ts);
    R(g, cx - 8, 113, 17, 9, p.book); R(g, cx, 113, 1, 9, shade(p.book, 0.3)); R(g, cx - 7, 112, 15, 1, '#f1eee4');
    if ((tt % 9) < 0.35) R(g, cx + 2, 110, 4, 2, '#f1eee4');                    // ページをめくる
    R(g, cx - 9, 117, 2, 4, sk); R(g, cx + 8, 117, 2, 4, sk);
  } else if (p.pose === 'sleep') {
    R(g, cx - 12, 117, 25, 6, Ts); R(g, cx - 10, 117, 21, 1, T); R(g, cx + 7, 119, 3, 3, sk); R(g, cx - 10, 120, 3, 3, sk); // 腕組み
  } else {
    if (p.bag) { const bc = shade(p.cap, 0.35); R(g, cx - 8, 123, 17, 11, bc); R(g, cx - 8, 123, 17, 1, tint(bc, 0.2)); R(g, cx - 3, 121, 7, 2, shade(bc, 0.2)); }
    R(g, cx - 13, sy + 21, 3, 6, Ts); R(g, cx + 11, sy + 21, 3, 6, Ts);
    R(g, cx - 11, p.bag ? 124 : 130, 4, 3, sk); R(g, cx + 8, p.bag ? 124 : 130, 4, 3, sk);
  }
  // 頭
  R(g, hx - 4, hy, 9, 12, sk); R(g, hx - 5, hy + 2, 11, 8, sk); R(g, hx - 3, hy + 12, 7, 1, sk); R(g, hx + 4, hy + 4, 1, 6, sks);
  if (p.hs === 3) {                                                             // 帽子
    const c = p.cap; R(g, hx - 4, hy - 1, 9, 2, c); R(g, hx - 5, hy + 1, 11, 3, c); R(g, hx - 6, hy + 4, 13, 1, shade(c, 0.3));
    R(g, hx - 5, hy + 5, 1, 2, hair); R(g, hx + 5, hy + 5, 1, 2, hair);
  } else {
    R(g, hx - 4, hy - 1, 9, 3, hair); R(g, hx - 5, hy + 1, 11, 3, hair); R(g, hx - 5, hy + 4, 1, 3, hair); R(g, hx + 5, hy + 4, 1, 3, hair);
    if (p.hs === 0) R(g, hx - 4, hy + 4, 3, 1, hair); else R(g, hx - 4, hy + 4, 9, 1, hair);
    if (p.hs === 1) { R(g, hx - 6, hy + 2, 2, 14, hair); R(g, hx + 5, hy + 2, 2, 14, hair); }
    if (p.hs === 2) { R(g, hx - 6, hy + 2, 2, 9, hair); R(g, hx + 5, hy + 2, 2, 9, hair); }
    if (!eyes) R(g, hx - 4, hy + 4, 9, 2, hair);
  }
  if (eyes) { const blink = (tt % 4.3) < 0.12, ec = blink ? sks : '#2a2622'; R(g, hx - 3 + p.look, ey, 2, 1, ec); R(g, hx + 2 + p.look, ey, 2, 1, ec); }
  else { R(g, hx - 3, hy + 8, 2, 1, sks); R(g, hx + 2, hy + 8, 2, 1, sks); }
  if (p.mask) { R(g, hx - 4, hy + 9, 9, 3, '#eef1f1'); R(g, hx - 5, hy + 9, 1, 1, '#eef1f1'); R(g, hx + 5, hy + 9, 1, 1, '#eef1f1'); }
  else R(g, hx - 1, hy + 10, 3, 1, sks);
}

/* ---------- state ---------- */
let dist = 0, t = 0, speed = 240, playing = true, last = performance.now();
let nextJoint = 120; const bobs = [];
const RAIL = 250; // 25 m レール（線路際・基準ドットで 1ドット ≒ 10cm）
const lineLabel = document.getElementById('line-label'), speedLabel = document.getElementById('speed-label');
let speedShown = -1, speedTimer = 0;

function setSeed(n) {
  seed = n >>> 0; dist = 0; nextJoint = 120; bobs.length = 0;
  layers.forEach(l => l.cache.clear());
  genPassengers();
  lineLabel.textContent = '路線 ' + String(seed).padStart(4, '0');
}
function seedFromHash() { const m = /^#line-(\d{1,6})$/.exec(location.hash); return m ? parseInt(m[1], 10) : null; }
function newLine() {
  const n = 1000 + Math.floor(Math.random() * 9000);
  setSeed(n);
  try { location.hash = 'line-' + n; } catch (e) {}
}
function rebuild() { palCache.clear(); buildSky(); drawInterior(); layers.forEach(l => l.cache.clear()); }
function setScale(k) {
  K = k; W = u(320); SY = u(26); SH = u(80); VY = u(20); VH = u(130);
  SUB = K === 1 ? 2 : 1; // 標準だけ2倍の解像度で描き、揺れを半ドットにする
  cv.width = W * SUB; cv.height = VH * SUB; cx.imageSmoothingEnabled = false;
  sky.width = W; sky.height = SH + 2; interior.width = W; interior.height = u(180);
  layers.forEach(l => { l.cw = u(l.cw0); });
  rebuild(); fit();
}

/* ---------- audio (Web Audio 合成) ---------- */
let ac = null, master = null, white = null, rumbleF = null, motor = null, soundOn = false, volume = 0.6;
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = volume; master.connect(ac.destination);
  const n = ac.sampleRate * 2;
  const brown = ac.createBuffer(1, n, ac.sampleRate), bd = brown.getChannelData(0);
  white = ac.createBuffer(1, n, ac.sampleRate); const wd = white.getChannelData(0);
  let lastV = 0;
  for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; wd[i] = w; lastV = (lastV + 0.02 * w) / 1.02; bd[i] = lastV * 3.5; }
  const bs = ac.createBufferSource(); bs.buffer = brown; bs.loop = true;
  rumbleF = ac.createBiquadFilter(); rumbleF.type = 'lowpass'; rumbleF.frequency.value = 420;
  const rg = ac.createGain(); rg.gain.value = 0.55;
  bs.connect(rumbleF); rumbleF.connect(rg); rg.connect(master); bs.start();
  const ws = ac.createBufferSource(); ws.buffer = white; ws.loop = true;
  const hf = ac.createBiquadFilter(); hf.type = 'bandpass'; hf.frequency.value = 1800; hf.Q.value = 0.6;
  const hg = ac.createGain(); hg.gain.value = 0.02;
  ws.connect(hf); hf.connect(hg); hg.connect(master); ws.start();
  motor = ac.createOscillator(); motor.type = 'sawtooth'; motor.frequency.value = 92;
  const mf = ac.createBiquadFilter(); mf.type = 'lowpass'; mf.frequency.value = 260;
  const mg = ac.createGain(); mg.gain.value = 0.012;
  motor.connect(mf); mf.connect(mg); mg.connect(master); motor.start();
}
function click(when, strength) {
  const src = ac.createBufferSource(); src.buffer = white;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 850 + Math.random() * 200; bp.Q.value = 1.1;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5 * strength, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.07);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(when, Math.random() * 1.5, 0.09);
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(115, when); o.frequency.exponentialRampToValueAtTime(52, when + 0.09);
  const og = ac.createGain();
  og.gain.setValueAtTime(0.55 * strength, when); og.gain.exponentialRampToValueAtTime(0.001, when + 0.13);
  o.connect(og); og.connect(master); o.start(when); o.stop(when + 0.15);
}
function jointPattern() {
  // 継ぎ目を自車の前台車・後台車、隣の車両の台車が順に踏む
  const pat = [[0, 1], [21, 0.9], [138, 1], [159, 0.9], [200, 0.35], [221, 0.3]];
  for (const [px, s] of pat) {
    const dt = px / speed;
    if (px === 0 || px === 138) bobs.push(t + dt);
    if (soundOn && ac && ac.state === 'running') click(ac.currentTime + 0.02 + dt, s);
  }
}

/* ---------- frame ---------- */
function update(dt) {
  t += dt;
  speed = 240 * (0.9 + 0.08 * Math.sin(t * 0.07) + 0.03 * Math.sin(t * 0.23 + 1));
  dist += speed * dt;
  while (dist >= nextJoint) { jointPattern(); nextJoint += RAIL; }
  speedTimer -= dt;
  if (speedTimer <= 0) {
    speedTimer = 0.5;
    const kmh = Math.round(speed * 0.36);
    if (kmh !== speedShown) { speedShown = kmh; speedLabel.textContent = kmh + ' km/h'; }
    if (ac && rumbleF) { rumbleF.frequency.setTargetAtTime(180 + speed, ac.currentTime, 0.3); motor.frequency.setTargetAtTime(speed * 0.385, ac.currentTime, 0.3); }
  }
}
function render() {
  let bob = 0;
  while (bobs.length && bobs[0] + 0.07 < t) bobs.shift();
  for (const b of bobs) if (t >= b && t < b + 0.07) { bob = 1 / SUB; break; }
  const oy = SY + bob;
  cx.setTransform(SUB, 0, 0, SUB, 0, -VY * SUB);
  cx.drawImage(sky, 0, SY);
  clouds.render(cx, (dist * clouds.f + t * 1.2) * K, oy);
  far.render(cx, dist * far.f * K, oy);
  mid.render(cx, dist * mid.f * K, oy);
  near.render(cx, dist * near.f * K, oy);
  track.render(cx, dist * track.f * K, oy);
  // 架線と架線柱（隣の線路）
  const SPAN = Math.round(480 * K), wx = Math.floor(dist * 1.2 * K), dr = u(96), dro = u(48), wy = u(13), my0 = u(5), sag = u(6);
  cx.fillStyle = P('#3d4442');
  cx.fillRect(0, oy + wy, W, 1);
  for (let x = 0; x < W; x++) {
    const p = (((wx + x) % SPAN) + SPAN) % SPAN / SPAN, yy = oy + my0 + Math.round(sag * 4 * p * (1 - p));
    cx.fillRect(x, yy, 1, 1);
    if ((((wx + x) % dr) + dr) % dr === dro) cx.fillRect(x, yy, 1, oy + wy - yy);
  }
  for (let k = Math.floor(wx / SPAN); k * SPAN < wx + W + u(20); k++) {
    const sx = k * SPAN - wx;
    R(cx, sx, SY, u(4), SH + 2, '#4b5350'); R(cx, sx, SY, 1, SH + 2, '#75807c');
    R(cx, sx - u(12), SY + u(3), u(30), u(2), '#4b5350');
  }
  // ガラスの映り込み
  if (STYLE.glass) {
    cx.globalAlpha = 0.08; cx.fillStyle = '#ffffff';
    for (let y = u(28); y < u(104); y++) {
      const s = (u(103) - y) >> 1;
      cx.fillRect(u(70) + s, y, u(9), 1); cx.fillRect(u(86) + s, y, u(3), 1);
      cx.fillRect(u(196) + s, y, u(9), 1); cx.fillRect(u(212) + s, y, u(3), 1);
    }
    cx.globalAlpha = 1;
  }
  cx.drawImage(interior, 0, 0);
  if (showPass) for (const p of passengers) drawPerson(cx, p, t);
  drawStraps(cx, t, bob ? 0.5 : 0);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) { update(dt); render(); }
  requestAnimationFrame(frame);
}

/* ---------- sizing: ドットが均一になるよう、端末ピクセルの整数倍で表示する ---------- */
const stage = document.getElementById('stage');
function fit() {
  const dpr = window.devicePixelRatio || 1, aw = stage.clientWidth, ah = stage.clientHeight, bw = W * SUB, bh = VH * SUB;
  let s = Math.floor(Math.min(aw / bw, ah / bh) * dpr) / dpr;
  if (!(s * dpr >= 1)) s = Math.max(0.1, Math.min(aw / bw, ah / bh));
  cv.style.width = (bw * s) + 'px'; cv.style.height = (bh * s) + 'px';
}
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

/* ---------- controls ---------- */
const btnSound = document.getElementById('btn-sound'), btnPause = document.getElementById('btn-pause');
const btnLine = document.getElementById('btn-line'), btnFull = document.getElementById('btn-full'), vol = document.getElementById('vol');
const styleSel = document.getElementById('style'), btnPass = document.getElementById('btn-pass');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
{ const v = store.get('shasou-vol'); if (v !== null && !isNaN(+v)) { volume = Math.min(1, Math.max(0, +v)); vol.value = Math.round(volume * 100); } }
function syncAudio() {
  if (!ac) return;
  if (soundOn && playing && !document.hidden) ac.resume().catch(() => {}); else ac.suspend().catch(() => {});
}
btnSound.addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn && !ac) { try { initAudio(); } catch (e) { soundOn = false; btnSound.textContent = '音は使えません'; btnSound.disabled = true; return; } }
  btnSound.setAttribute('aria-pressed', String(soundOn));
  btnSound.textContent = soundOn ? '音を止める' : '音を出す';
  syncAudio();
});
vol.addEventListener('input', () => {
  volume = vol.value / 100;
  if (master) master.gain.setTargetAtTime(volume, ac.currentTime, 0.03);
  store.set('shasou-vol', String(volume));
});
function setPlaying(p) {
  playing = p; last = performance.now();
  btnPause.setAttribute('aria-pressed', String(!p));
  btnPause.textContent = p ? '一時停止' : '再開する';
  syncAudio();
}
btnPause.addEventListener('click', () => setPlaying(!playing));
btnLine.addEventListener('click', () => { newLine(); if (!playing) render(); });
if (!document.fullscreenEnabled || !stage.requestFullscreen) btnFull.hidden = true;
btnFull.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else stage.requestFullscreen().catch(() => { btnFull.hidden = true; });
});
styleSel.addEventListener('change', () => {
  STYLE = STYLES[styleSel.value] || STYLES.real; rebuild();
  store.set('shasou-style', styleSel.value);
  if (!playing) render();
});
btnPass.addEventListener('click', () => {
  showPass = !showPass;
  btnPass.setAttribute('aria-pressed', String(showPass));
  btnPass.textContent = showPass ? '乗客あり' : '乗客なし';
  store.set('shasou-pass', showPass ? '1' : '0');
  if (!playing) render();
});
document.addEventListener('visibilitychange', () => { last = performance.now(); syncAudio(); });
window.addEventListener('hashchange', () => { const n = seedFromHash(); if (n !== null && n !== seed) { setSeed(n); if (!playing) render(); } });

/* ---------- boot ---------- */
{ const s0 = store.get('shasou-style'); if (s0 && STYLES[s0]) { STYLE = STYLES[s0]; styleSel.value = s0; } }
if (store.get('shasou-pass') === '0') { showPass = false; btnPass.setAttribute('aria-pressed', 'false'); btnPass.textContent = '乗客なし'; }
const h0 = seedFromHash();
setSeed(h0 !== null ? h0 : 1000 + Math.floor(Math.random() * 9000));
setScale(1);
update(0.016); render();
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) setPlaying(false);
requestAnimationFrame(frame);
})();
</script>
